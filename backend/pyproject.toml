[project]
name = "adaptive-ai-tutor-backend"
version = "0.1.0"
description = "FastAPI backend for the Adaptive AI Tutor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "pymongo>=4.13.0",
    "google-genai>=1.20.0",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.9.0",
    # Timezone data for zoneinfo; Windows doesn't ship it, and streak days use the learner's timezone.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]